name: Test

on:
  push:
    branches:
      - main
      - staging
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Linux system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            pkg-config \
            wget

      - name: Set up Python 3.12 (runtime lock checks)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: No child process spawns a console window on Windows
        # Headroom is a GUI-subsystem binary, so any console-subsystem child
        # spawned without CREATE_NO_WINDOW gets its own visible (and blank,
        # since we pipe stdio) console. See src-tauri/src/proc.rs.
        run: ./scripts/check-no-console.sh

      - name: No new raw colors in component CSS
        # Ratchet, not a clean gate: styles.css carries a token-migration
        # backlog, so the script fails only when the count grows. Dark mode is
        # driven entirely by the :root token overrides, so a hardcoded color in
        # a component rule is a light-mode-only color that ships broken.
        run: ./scripts/check-colors.sh

      - name: Locks cover every headroom-ai dependency
        # The wheel installs with --no-deps, so a dep absent from a lock is an
        # ImportError at backend start, not something pip resolves later.
        # Covers all three platform locks in one pass.
        run: |
          python -m pip install --quiet packaging
          python scripts/check-python-locks.py

      - name: Injected sitecustomize.py is valid Python
        # SITECUSTOMIZE_PY is ~2,300 lines of Python held in a Rust raw string,
        # carrying every vendored upstream patch. The Rust tests that run it
        # self-skip without a managed runtime, which this runner lacks (only
        # test-macos builds one), so without this a syntax error is invisible
        # here and lands as silently inert vendors on user machines.
        run: python scripts/check-sitecustomize-syntax.py

      - name: Linux runtime lock resolves to wheels only
        # Mirrors the Windows job's check: a pin with no manylinux wheel makes
        # bootstrap compile from source on the user's machine. No --platform,
        # deliberately: this job already runs on Linux x86_64, and pip matches
        # --platform against wheel tags exactly rather than accepting older
        # compatible ones, so naming manylinux_2_28 rejected the manylinux_2_17
        # wheels that packages like orjson actually publish. Resolving for the
        # runner's own platform is both simpler and a truer model of a user's
        # machine. --find-links mirrors VENDOR_WHEELS_INDEX_URL in
        # tool_manager.rs, the way the Windows check does.
        run: >
          python -m pip install --dry-run --no-deps --only-binary=:all:
          --find-links https://github.com/gglucass/headroom-desktop/releases/expanded_assets/vendor-wheels-v1
          -r src-tauri/python/headroom-linux-requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: nextest

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: React hook rules
        # rules-of-hooks and exhaustive-deps, both errors (eslint.config.js):
        # a conditionally-called hook corrupts hook order for every hook after
        # it, and App.tsx has 78 useEffect calls with nothing else checking them.
        run: npm run lint

      - name: Run app test suite
        run: ./scripts/verify-release.sh

  test-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: nextest

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Set up Python 3.12 (runtime lock check)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: Windows runtime lock resolves to wheels only
        # A pin without a win_amd64/universal wheel makes bootstrap compile
        # from source, which needs MSVC and bricks every user install without
        # build tools (hnswlib, RUST-65). Fail here instead. --dry-run
        # resolves the full pin set without installing; the --find-links
        # mirror matches VENDOR_WHEELS_INDEX_URL in tool_manager.rs.
        shell: bash
        run: >
          python -m pip install --dry-run --no-deps --only-binary=:all:
          --find-links https://github.com/gglucass/headroom-desktop/releases/expanded_assets/vendor-wheels-v1
          -r src-tauri/python/headroom-windows-requirements.lock

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npx tsc --noEmit

      - name: Run frontend tests
        run: npm run test:coverage

      - name: Run desktop tests
        shell: bash
        # --no-fail-fast: enumerate every Windows failure in one run instead of
        # one class per approve/fix round while the platform is being hardened.
        run: cargo nextest run --no-fail-fast --manifest-path src-tauri/Cargo.toml

  test-macos:
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12 (runtime lock check)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          # The wheel-test runtime below downloads ~2 GB of locked wheels.
          cache: pip
          cache-dependency-path: src-tauri/python/headroom-requirements.lock

      - name: macOS arm64 runtime lock resolves to wheels only
        # Same gate as the Linux and Windows jobs, for the primary platform.
        # The macOS lock splits pins by environment marker (onnxruntime 1.27.0
        # on arm64, 1.23.2 on Intel), so this job only proves the arm64 branch
        # resolves; macos-intel-lock covers the other. No --platform: pip
        # matches wheel tags exactly rather than accepting older compatible
        # ones, so resolving for the runner's own arch is the truer model.
        run: >
          python -m pip install --dry-run --no-deps --only-binary=:all:
          --find-links https://github.com/gglucass/headroom-desktop/releases/expanded_assets/vendor-wheels-v1
          -r src-tauri/python/headroom-requirements.lock

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
        with:
          # Pinned: the clippy step below fails on warnings, and every new
          # stable adds lints (1.98 turned rc3 and rc4 red on seven sites).
          # Bump deliberately, after `cargo +<new> clippy --all-targets` is clean.
          toolchain: 1.98.1
          components: clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: nextest

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: |
            src-tauri -> target

      - name: Clippy (warnings are errors)
        # The 2026-09-21 restart-marker writer was never called, and the only
        # signal was a `never used` warning nobody saw. macOS only: that is
        # where most cfg-gated code lives and where it can be reproduced locally.
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: Install frontend dependencies
        run: npm ci

      - name: Run app test suite
        # macOS is the primary platform but was previously only gated inside
        # the release workflows, so a macOS-only regression reached staging
        # green and surfaced at release cut. Gate it on PR instead.
        run: ./scripts/verify-release.sh

      - name: Vendored patches against the pinned wheel
        # Every *_behaves_against_the_installed_wheel test self-skips without
        # a managed runtime, which is every runner, so until this step CI had
        # never executed a single vendor in SITECUSTOMIZE_PY. Build the runtime
        # the app builds (this platform's lock, then the pinned wheel, both
        # --no-deps) and run them for real. Any skip fails the step: under the
        # exact pin every vendor must bind, and after a wheel bump a skip is
        # the cue to drop or re-pin that vendor (Wheel Bump Rules, CLAUDE.md).
        # macOS because the truststore vendor runs only here and on Windows.
        # One test at a time: each spawns a Python probe with sub-second
        # deadlines, and fourteen at once on a 3-vCPU runner starve the
        # responses-budget probe into a false "fixed request still timed out".
        shell: bash
        env:
          HEADROOM_DATA_DIR: ${{ runner.temp }}/headroom-wheel
        run: |
          pin=$(sed -n 's/^pub(crate) const HEADROOM_PINNED_VERSION: &str = "\(.*\)";/\1/p' src-tauri/src/tool_manager.rs)
          test -n "$pin"
          python -m venv "$HEADROOM_DATA_DIR/headroom/runtime/venv"
          py="$HEADROOM_DATA_DIR/headroom/runtime/venv/bin/python"
          "$py" -m pip install --quiet --no-deps --only-binary=:all: \
            --find-links https://github.com/gglucass/headroom-desktop/releases/expanded_assets/vendor-wheels-v1 \
            -r src-tauri/python/headroom-requirements.lock
          "$py" -m pip install --quiet --no-deps --only-binary=:all: "headroom-ai==$pin"
          cargo test --manifest-path src-tauri/Cargo.toml --lib against_the_installed_wheel \
            -- --nocapture --test-threads=1 2>&1 | tee "$RUNNER_TEMP/wheel-tests.log"
          if grep 'skipping:' "$RUNNER_TEMP/wheel-tests.log"; then
            echo "::error::a vendor test skipped against headroom-ai $pin"
            exit 1
          fi
          grep -qE 'test result: ok\. [1-9][0-9]* passed' "$RUNNER_TEMP/wheel-tests.log"

  macos-intel-lock:
    # Intel Macs still receive the shipped app: the release builds
    # --target universal-apple-darwin. A pin whose macOS wheels are arm64-only
    # is a bootstrap dead end for every Intel user (RUST, 2026-08-20:
    # onnxruntime resolved to a version with no x86_64 macOS wheel and the
    # install could not complete). Only Python is needed, so this stays a thin
    # job rather than a second full test matrix entry.
    # macos-15-intel is the last x86_64 image Actions offers, available until
    # roughly August 2027; macos-13 was retired in December 2025.
    runs-on: macos-15-intel
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.12 (runtime lock check)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      - name: macOS x86_64 runtime lock resolves to wheels only
        run: >
          python -m pip install --dry-run --no-deps --only-binary=:all:
          --find-links https://github.com/gglucass/headroom-desktop/releases/expanded_assets/vendor-wheels-v1
          -r src-tauri/python/headroom-requirements.lock

  advisories:
    # Separate job so a newly-published advisory reds a distinguishable check
    # rather than looking like a test regression. Both audits read committed
    # lockfiles, so this needs no build.
    # Known tradeoff: an advisory published upstream can red an unrelated PR.
    # If that gets noisy, ignore the specific ID here rather than dropping the
    # job -- `cargo audit --ignore RUSTSEC-YYYY-NNNN`.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable
      - name: Install cargo-audit
        uses: taiki-e/install-action@7623a79cdfecb99d681017af368ca353d9f49bb5 # v2
        with:
          tool: cargo-audit
      - name: Rust dependency advisories
        # The two ignores are quick-xml DoS advisories reachable only through
        # tauri's own tree (plist 1.8 pins ^0.38, tauri-winrt-notification 0.7
        # pins ^0.37; both reject 0.41, so there is no upgrade from here).
        # Neither parse path takes attacker-controlled XML -- plist reads our
        # own bundle Info.plist, and the notification crate serializes toast XML
        # we generate. Drop these the moment a tauri bump moves the pins;
        # `cargo audit` prints them as unnecessary ignores when that happens.
        run: >
          cargo audit --file src-tauri/Cargo.lock
          --ignore RUSTSEC-2026-0194
          --ignore RUSTSEC-2026-0195
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - name: Frontend dependency advisories
        # --omit=dev: a devDependency advisory is not in the shipped bundle and
        # would block releases on something users never run.
        run: npm audit --audit-level=high --omit=dev
