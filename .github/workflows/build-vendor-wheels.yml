name: Build vendor wheels

# Builds wheels for sdist-only PyPI packages (currently: hnswlib==0.8.0) and
# publishes them to the `vendor-wheels-v1` GitHub Release so end-user bootstraps
# can resolve them via `pip install --find-links` without needing a local C++
# toolchain. Manually dispatched; re-run when bumping pinned versions.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to publish wheels to"
        required: true
        default: "vendor-wheels-v1"
      hnswlib_version:
        description: "hnswlib version to build"
        required: true
        default: "0.8.0"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-26
            arch: arm64
          - os: ubuntu-latest
            arch: x86_64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Build hnswlib wheel
        env:
          HNSWLIB_VERSION: ${{ github.event.inputs.hnswlib_version }}
        run: |
          python -m pip install --upgrade pip wheel build
          python -m pip wheel "hnswlib==${HNSWLIB_VERSION}" --no-deps --wheel-dir ./dist
          ls -la ./dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wheels-${{ matrix.os }}-${{ matrix.arch }}
          path: ./dist/*.whl

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ./dist
          merge-multiple: true
      - name: List wheels
        run: ls -la ./dist
      - name: Publish to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # --latest=false: a new full release otherwise becomes
            # releases/latest, which has no latest.json, and every stable
            # install's update check 404s (silently) until the next stable.
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --latest=false \
              --title "Vendor wheels ($TAG)" \
              --notes "Pre-built wheels for sdist-only PyPI packages. Consumed by headroom-desktop bootstrap via pip --find-links."
          fi
          gh release upload "$TAG" ./dist/*.whl --repo "$GITHUB_REPOSITORY" --clobber
