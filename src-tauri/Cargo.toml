[package]
name = "headroom-desktop"
version = "0.9.35-rc.6"
description = "Headroom v1 local-first LLM optimization tray app"
authors = ["Codex"]
license = "MIT"
edition = "2021"

[lib]
name = "headroom_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
anyhow = "1.0"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
flate2 = "1.0"
image = { version = "0.25", default-features = false, features = ["png"] }
json5 = "=0.4.1"
libc = "0.2"
log = { version = "0.4", features = ["std"] }
os_info = "3.10"
parking_lot = "0.12"
rand = "0.9"
# rustls-tls-native-roots: trust the OS store (and SSL_CERT_FILE) on top of the
# bundled webpki roots, so a TLS-inspecting network's corporate root works.
# Loading it costs ~130ms per build on macOS, so loopback clients opt out with
# .tls_built_in_root_certs(false) (every_reqwest_client_decides_about_the_system_proxy).
# system-proxy is macOS-only, in the target table below.
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "json", "rustls-tls", "rustls-tls-native-roots"] }
rusqlite = { version = "0.32", features = ["bundled"] }
sentry = { version = "0.35", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = { version = "=1.0.149", features = ["raw_value"] }
sha2 = "=0.10.9"
sys-locale = "0.3"
tar = "0.4"
tauri = { version = "=2.11.1", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-deep-link = "2"
tauri-plugin-notification = "2.3.3"
tauri-plugin-single-instance = "2"
tauri-plugin-updater = "2.10.0"
time = "=0.3.47"
toml = "0.8"
tokio = { version = "=1.50.0", features = ["macros", "rt-multi-thread", "process", "fs", "time"] }
uuid = { version = "=1.22.0", features = ["v4", "serde"] }

# Cross-platform, not only the Windows rtk unzip: the MSVC runtime DLL
# vendoring helper and its tests compile everywhere; the call site is gated.
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"
serial_test = "3"

[target.'cfg(target_os = "macos")'.dependencies]
mac-notification-sys = "0.6"
# system-proxy: honor the System Settings proxy, not only *_PROXY env; via the
# shared hyper-util feature it also reaches the updater's reqwest 0.13. Not on
# Windows: hyper-util parses HKCU ProxyServer raw, and the values real machines
# carry there (v2rayN `socks=127.0.0.1:10808`, `socks4://...`, see
# registry_proxy_env_overrides) become an unusable proxy for every client,
# where going direct worked. Linux has no system reader to enable.
reqwest = { version = "=0.12.28", default-features = false, features = ["system-proxy"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_DataExchange"] }
# Windows-only: std/tokio set SO_REUSEADDR on Unix but not here, so rebinding
# the intercept port over a previous instance's draining TIME_WAIT sockets
# needs the option set by hand before bind. See `reuse_bound_std_listener`.
socket2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# Same crate as the Windows entry above, different backend: sync-secret-service
# talks to the DBus Secret Service (gnome-keyring/kwallet), which persists
# across reboots, where keyring's other Linux option (linux-native, kernel
# keyutils) does not. crypto-rust keeps the session encryption pure Rust so the
# build needs no openssl headers. Declared per-target rather than once with
# every feature, so Windows and macOS builds do not drag in dbus/zbus.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
# Already in every Linux build through gtk/tao; named here for
# `glib::unix_signal_add`, which turns SIGTERM/SIGHUP/SIGINT into a normal quit
# (see `route_signals_to_exit`).
glib = "0.18"
