# Reviewed known-good Headroom runtime lock.
# Source: headroom-ai[all,vector]==0.35.0 dependency resolution for cp312 /
# macOS 14 arm64 (min deployment target 14.0). Base pins captured on 2026-06-30,
# carried forward and topped up per bump (see lineage).
#
# Resolution lineage: 0.25.0 freeze -> carried to 0.26.0/0.27.0 -> regenerated
# for 0.28.0 (base of the current pin set) -> carried through 0.29.0-0.31.0
# point-version churn -> 0.32.0 -> carried unchanged to 0.33.0 -> 0.34.0
# CVE top-up -> 0.35.0 CVE top-up -> carried to 0.37.0 -> 0.38.0 CVE top-up.
#   - 2026-09-29 CVE top-up alongside hash pinning (pip-audit now gates CI):
#     pyjwt 2.13.0 -> 2.14.0 (CVE-2026-102274, a malformed RSA key aborts
#     parsing of a whole JWK Set) and datasets 5.0.0 -> 5.0.1 (CVE-2026-66007,
#     path traversal in folder-based dataset builders). Both pure-Python wheel
#     swaps: pyjwt's requires_dist is unchanged, datasets only widens its fsspec
#     ceiling (2026.4.0 -> 2026.6.0) above the pinned fsspec 2026.4.0.
#   - 2026-09-29 hash pinning (no wheel bump): every entry now carries its
#     wheels' sha256 (scripts/hash-python-locks.py; rerun it after any pin
#     change). Hash checking refuses unpinned requirements, which exposed the
#     one gap in this lock's closure: onnxruntime 1.23.2, the Intel-only pin,
#     requires coloredlogs -> humanfriendly, which pip had been fetching
#     unpinned on Intel Macs. Both are now pinned, Intel-only, at the versions
#     those installs already had. arm64 installs no new package.
#   - 2026-09-23 desktop CVE top-up (no wheel bump): pillow 12.2.0 -> 12.3.0
#     (25 advisories, several in decoders). The proxy's image optimizer
#     (image_optimize, default on) runs Image.open on image bytes from agent
#     traffic, so this parser sees untrusted input. Native wheel swap, no deps,
#     cp312 wheels for every platform the locks cover.
#   - 2026-10-01 (no wheel change): three pins topped up for advisories
#     published after 0.39.0 shipped: urllib3 2.7.0 -> 2.8.0 (CVE-2026-97687,
#     -97688, -97689), pyjwt 2.14.0 -> 2.15.0 (CVE-2026-101918), and litellm
#     1.90.1 -> 1.90.7 / 1.88.1 -> 1.88.6 on Linux (CVE-2026-84377), the
#     nearest patch on each existing line rather than the 1.96.2 floor (see
#     0.38.0 below). All pure-Python wheel swaps; requires_dist unchanged except
#     litellm 1.88.6's aiohttp>=3.14.2, already met by the 3.14.3 pin. No package
#     is added to or removed from the installed set.
#   - 2026-10-06 (no wheel change): fsspec 2026.4.0 -> 2026.6.0
#     (CVE-2026-104851) and multidict 6.7.1 -> 6.9.1 (CVE-2026-104874), both
#     published overnight and failing CI's pip-audit on every lock. fsspec is
#     pure-Python with no deps and 2026.6.0 is exactly datasets 5.0.1's
#     ceiling; multidict is a native wheel swap (cp312 wheels for every
#     platform), inside aiohttp's <7.0, no new deps on cp312.
#   - 0.38.0: one transitive pin topped up to match upstream's #3662 CVE
#     clearance: anyio 4.14.1 -> 4.14.2 (CVE-2026-63374, CVE-2026-64847),
#     pure-Python, wheel swap only. requires_dist raised the litellm floor to
#     1.96.2 for Python 3.14 wheel availability only (the API headroom uses
#     is unchanged and the venv is cp312), so litellm stays at 1.90.1: 1.96.2
#     would add pydantic-settings to every lock for nothing this runtime
#     runs. No package is added to or removed from the installed set.
#   - 0.35.0: requires_dist only moves the ruff dev pin (dev extra not
#     installed), so no resolution change. One transitive pin topped up to
#     match upstream's #2839 CVE clearance: h2 4.3.0 -> 4.4.1
#     (CVE-2026-71554). h2 is pure-Python and its hpack >=4.2 /
#     hyperframe >=6.1 floors are already satisfied by the shipped pins,
#     so this is a wheel swap with no resolution or native churn.
#   - 0.34.0: requires_dist is byte-identical to 0.33.0, so no resolution
#     change. Two transitive pins topped up to match upstream's 0.34.0 lock
#     (their #2753 CVE clearance): aiohttp 3.14.1 -> 3.14.3 and cryptography
#     49.0.0 -> 50.0.0. Both are version *changes* of native wheels, so pip
#     uninstalls the old wheel via RECORD before unpacking the new one -- no
#     stale-.so layering; rebuild floor stays at 0.20.0.
#   - 0.33.0: no pin moves. Its requires_dist only tightens three existing
#     constraints, all already satisfied here: ast-grep-cli !=0.44.1 (we pin
#     0.44.0), mcp >=1.28.1,<2.0.0 on the mcp/proxy extras (we pin 1.28.1), and
#     ruff on the dev extra (not installed). No package is added to or removed
#     from the installed [all,vector] set, so the upgrade is a wheel-only
#     --no-deps reinstall for every existing user.
#   - 0.32.0: two new hard deps landed in 0.32.0's requires_dist for the
#     installed [all,vector] set: tomlkit (unconditional core) and orjson
#     (proxy extra, CPython-only via `platform_python_implementation != "PyPy"`).
#     Both are leaf packages (no transitive deps), so they are appended without
#     re-resolving. headroom-ai installs --no-deps against this lock, so a
#     missing pin here is a ModuleNotFoundError at proxy boot, not a resolver
#     warning. Every other 0.32.0 requirement was already satisfied by the
#     carried-forward pins (verified against 0.32.0 requires_dist); rapidocr and
#     tomli also appear in requires_dist but are gated out on cp312 by their
#     python_version markers (>=3.13 and <3.11 respectively).
#   The 0.28.0 requires_dist changed enough that the lock was re-
# resolved from scratch rather than hand-patched. Notable deltas vs 0.27.0:
#   - benchmark extra dropped from headroom-ai[all], removing the eval tooling
#     tail (lm-eval, evaluate, sacrebleu, rouge-score, nltk, pytablewriter,
#     tabulate, sqlitedict, word2number, and their transitive deps). The proxy
#     never imported these; bundle shrinks.
#   - hnswlib moved from the `memory` extra to a new `vector` extra that [all]
#     does NOT include. We resolve [all,vector] so hnswlib==0.8.0 stays present
#     (the proxy memory adapters import it).
#   - torch 2.11.0 -> 2.12.1 (ml/voice floor raised to >=2.12.1). 2.12.1 ships
#     only macosx_14_0_arm64 wheels. CORRECTION (2026-08-17): the original note
#     here claimed this was "safe because minimumSystemVersion is 14.0, so every
#     supported user gets a wheel" -- that checked the OS floor and missed the
#     ARCH. The app ships as a universal binary, so Intel Macs are a supported
#     target, and they get no wheel at all. See the arch markers below.
#
# ARCH MARKERS (2026-08-17, Sentry RUST-6S / RUST-21). This lock is resolved for
# arm64 but installed on both mac arches. Three pins have no macOS x86_64 wheel,
# so `pip install -r` aborted the WHOLE bootstrap on every Intel Mac -- no venv,
# no backend. Failing since at least 2026-04-25 (RUST-21, archived, 91 events).
# torch/sentence-transformers are EXCLUDED on Intel Mac, matching headroom-ai's
# own metadata, which already declares them arm64-only on darwin:
#   torch>=2.12.1 ; (platform_machine != 'x86_64' and extra == 'ml')
#                   or (sys_platform != 'darwin' and extra == 'ml')
# Their importers in headroom (memory/adapters/embedders.py,
# proxy/memory_handler.py) all guard with try/except ImportError, so Intel
# degrades to non-ML embedding instead of failing. onnxruntime is required
# unconditionally by the `proxy` extra (>=1.16.0), so Intel gets the newest
# version that still ships an x86_64 wheel (1.23.2, last before upstream dropped
# Intel mac at 1.24.0; no known advisories). Keep both arches' pins in sync on
# every bump: check `pip index versions <pkg>` for a macosx x86_64 wheel before
# raising a native pin, not just the OS floor.
#   - broad point-version churn (anthropic, openai, litellm, transformers,
#     onnxruntime, protobuf 6->7, etc.) from the fresh resolution.
